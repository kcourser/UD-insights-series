<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPRT+ Insights Series — local preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050a14;
      color: #EAF2FB;
      font-family: Poppins, system-ui, sans-serif;
    }
    .frame {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      font-size: 14px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    .note {
      font-size: 13px;
      color: #9FB2CC;
      margin: 0 0 20px;
      line-height: 1.45;
      max-width: 62ch;
    }
    .note code { color: #A8E0FF; font-size: 12px; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>UD 2026 · local preview</h1>
    <p class="note">
      Interactive Substack series browser (prototype). Flow: series → horizontal articles → on-site summary → Substack.
      Sample copy for <strong>Desert Capital</strong> and <strong>Clearsync Connect</strong> — replace URLs/thumbs in <code>series.json</code>.
    </p>
    <!-- Same pattern as Webflow embed: inline HTML file contents -->
    <iframe
      id="preview-frame"
      title="UPRT+ insights series"
      src="ud-insights-series.html"
      style="width:100%;height:740px;border:0;border-radius:12px;background:#01060F;"
    ></iframe>
  </div>
</body>
</html>
